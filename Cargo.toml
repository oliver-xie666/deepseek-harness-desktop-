[workspace]
resolver = "2"
members = [
    "crates/dsh-common",
    "crates/dsh-protocol",
    "crates/dsh-daemon",
    "crates/dsh-markdown",
    "crates/dsh-core",
    "crates/dsh-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["oliver-xie666 <153884673@qq.com>"]
license = "MIT"

[workspace.dependencies]
# Sub-crates
dsh-common = { path = "crates/dsh-common" }
dsh-protocol = { path = "crates/dsh-protocol" }
dsh-daemon = { path = "crates/dsh-daemon" }
dsh-markdown = { path = "crates/dsh-markdown" }
dsh-core = { path = "crates/dsh-core" }

# GPUI Framework
gpui = { path = "D:/rust/zed-fluid/crates/gpui" }
gpui_platform = { path = "D:/rust/zed-fluid/crates/gpui_platform" }

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.26"
futures = "0.3"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
clap = { version = "4.5", features = ["derive"] }

# Text & AST Processing
pulldown-cmark = "0.13"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
