[workspace]
resolver = "2"
members = [
    "crates/dsh-common",
    "crates/dsh-protocol",
    "crates/dsh-daemon",
    "crates/dsh-markdown",
    "crates/dsh-core",
    "crates/dsh-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["oliver-xie666 <153884673@qq.com>"]
license = "MIT"

[workspace.dependencies]
# Tokio Async Ecosystem
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
tokio-tungstenite = "0.26"

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & Utilities
thiserror = "2.0"
anyhow = "1.0"
directories = "6.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Markdown & AST
pulldown-cmark = { version = "0.12", default-features = false }

# Tree-sitter & Syntax
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"

# Internal Workspace Crates
dsh-common = { path = "crates/dsh-common" }
dsh-protocol = { path = "crates/dsh-protocol" }
dsh-daemon = { path = "crates/dsh-daemon" }
dsh-markdown = { path = "crates/dsh-markdown" }
dsh-core = { path = "crates/dsh-core" }
